<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon League — Dashboard</title>
    <meta name="description" content="Dashboard público de todos los entrenadores de la Pokémon League" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading">
        <div class="pokeball-spinner"></div>
        <p>Cargando entrenadores...</p>
    </div>

    <header>
        <h1>🏆 Pokémon League</h1>
        <p>Dashboard de entrenadores — Pokémon X</p>
    </header>

    <!-- Main Tabs -->
    <nav class="league-tabs">
        <button class="league-tab active" data-tab="trainers" onclick="switchLeagueTab('trainers')">👥 Entrenadores</button>
        <button class="league-tab" data-tab="rankings" onclick="switchLeagueTab('rankings')">📊 Rankings</button>
        <button class="league-tab" data-tab="battles" onclick="switchLeagueTab('battles')">⚔️ Combates</button>
    </nav>

    <div class="container">
        <!-- TAB: Entrenadores -->
        <section class="league-tab-content active" id="tab-trainers">
            <div class="trainers-section" id="trainers-section">
                <div class="section-title">
                    <span class="icon">👥</span>
                    <span>Entrenadores</span>
                    <span class="count" id="trainer-count">0</span>
                </div>
                <div class="trainers-grid" id="trainers-grid"></div>
            </div>

            <!-- Trainer Detail View (hidden initially) -->
            <section class="detail-section" id="detail-section" style="display:none">
                <button class="back-btn" id="back-btn" onclick="showTrainerList()">← Volver</button>
                <div id="trainer-detail"></div>
            </section>
        </section>

        <!-- TAB: Rankings -->
        <section class="league-tab-content" id="tab-rankings">
            <!-- Más Puntos -->
            <div class="ranking-section">
                <div class="section-title">
                    <span class="icon">🏆</span>
                    <span>Más Puntos</span>
                </div>
                <div class="ranking-list" id="ranking-points"></div>
            </div>

            <!-- Más Muertos -->
            <div class="ranking-section">
                <div class="section-title">
                    <span class="icon">💀</span>
                    <span>Más Muertos</span>
                </div>
                <div class="ranking-list" id="ranking-deaths"></div>
            </div>

            <!-- Más Shinys -->
            <div class="ranking-section">
                <div class="section-title">
                    <span class="icon">✨</span>
                    <span>Más Shinys</span>
                </div>
                <div class="ranking-list" id="ranking-shinys"></div>
            </div>
        </section>

        <!-- TAB: Combates -->
        <section class="league-tab-content" id="tab-battles">
            <div class="wip-panel">
                <div class="wip-icon">🚧</div>
                <h2>Combates — En Proceso</h2>
                <p>Esta sección estará disponible próximamente.</p>
                <p style="font-size:0.85rem;color:var(--text-muted);margin-top:8px;">Aquí podrás ver duelos y resultados entre entrenadores.</p>
            </div>
        </section>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
